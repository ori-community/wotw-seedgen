name: build

on:
  - push

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@master

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Build Seedgen
        run: cargo build -p wotw_seedgen_cli --release --all-features

      - name: Archive Linux Artifacts
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: seedgen-linux
          path: ./target/release/wotw-seedgen
          if-no-files-found: error

      - name: Archive Windows Artifacts
        if: ${{ matrix.os == 'windows-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: seedgen-windows
          path: ./target/release/wotw-seedgen.exe
          if-no-files-found: error

  compile_seeds:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@master

      - name: Download seedgen
        uses: actions/download-artifact@v4
        with:
          name: seedgen-linux

      - name: Compile installed seeds
        run: |
          export SEEDGEN_USER_DATA_DIR=assets
          chmod +x ./wotw-seedgen
          for seed in assets/plandos/src/*; do ./wotw-seedgen plando $seed; done

      - name: Archive Compiled Seeds
        uses: actions/upload-artifact@v4
        with:
          name: seeds
          path: assets/plandos/*.wotwr
